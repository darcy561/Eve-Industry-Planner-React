# Tempo, single binary, local storage.
#
# The limits here are set rather than defaulted. Tempo's defaults are sized for a
# cluster — 30 MB/s of ingest, a 5 GB block-builder budget, ten thousand live
# traces — and this stack runs on two cores and eight gigabytes with the rest of
# the services already on it. A store that helps itself to a share of the host is
# the failure this addon has to avoid.

target: all

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

live_store:
  query_block_concurrency: 2
  # Cut a block once it is this old or this large, whichever comes first. Short
  # windows keep the in-memory head small at the cost of more, smaller blocks.
  max_block_duration: 2m
  max_block_bytes: 20971520
  complete_block_timeout: 5m
  complete_block_concurrency: 1

block_builder:
  # Defaults to 5 GB, which is most of this host.
  max_consuming_bytes: 268435456
  block:
    max_block_bytes: 20971520

# Compaction runs in the background and is configured twice: the scheduler decides
# what to compact, the worker does it. Both default to hundred-gigabyte blocks and a
# fortnight of retention, neither of which the per-tenant overrides below govern.
backend_scheduler:
  provider:
    compaction:
      compaction:
        max_block_bytes: 268435456
        block_retention: 48h
        retention_concurrency: 2
        max_compaction_objects: 500000
      max_jobs_per_tenant: 50

backend_worker:
  compaction:
    max_block_bytes: 268435456
    block_retention: 48h
    retention_concurrency: 2
    max_compaction_objects: 500000

querier:
  max_concurrent_queries: 2

query_frontend:
  max_outstanding_per_tenant: 100
  # Defaults to a thousand jobs per query, which is a cluster's worth of parallelism.
  search:
    concurrent_jobs: 8
  trace_by_id:
    concurrent_shards: 2
  metrics:
    concurrent_jobs: 8

# The generator derives metrics from spans and runs whether or not a processor is
# configured for it. Sixteen ingest workers is more than this host has cores.
metrics_generator:
  ingest_concurrency: 2

storage:
  trace:
    # Polling the block list is a scan; fifty concurrent workers is for object
    # storage with a cluster behind it, not one local disk.
    blocklist_poll_concurrency: 4
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 2
      queue_depth: 200

overrides:
  defaults:
    ingestion:
      # Sized against measured use rather than the defaults: this stack idles at about 1.3 KB/s
      # across 16 traces in flight, so these leave roughly twenty-five times that headroom and
      # still contain a runaway long before it reaches the host. A burst above the rate is refused
      # at the receiver, which is the one limit that tells the collector to slow down.
      rate_limit_bytes: 512000
      burst_size_bytes: 1000000
      # Traces held in memory while their spans arrive, not traces stored or traces per second.
      # It binds when traces arrive faster than they complete, which is what a flood of shallow
      # traces does; the memory the live store can occupy follows from it.
      max_traces_per_user: 400
    global:
      max_bytes_per_trace: 2000000
    compaction:
      # The retention window. Traces are the highest-volume signal in this stack
      # and the one whose cost scales hardest with how long it is kept.
      block_retention: 48h

usage_report:
  reporting_enabled: false
